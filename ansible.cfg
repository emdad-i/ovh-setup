[defaults]
inventory = inventory.ini
host_key_checking = False
# YAML task output from the builtin callback. The community.general `yaml`
# callback breaks on ansible-core 2.19+ (AnsibleDumper is no longer a class).
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Optimizes SSH connections and handles typical OVH admin user routing
pipelining = True
